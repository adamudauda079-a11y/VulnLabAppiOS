name: Build Unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Discover Project
        run: |
          echo "===== Repo tree ====="
          find . -maxdepth 3 -not -path "*/\.git/*" | sort
          echo
          PROJECT_PATH=$(find . -name "*.xcodeproj" -maxdepth 4 -not -path "*/\.git/*" | head -n 1)
          echo "Found project: $PROJECT_PATH"
          echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_ENV
          xcodebuild -list -project "$PROJECT_PATH"

      - name: Build App Without Signing
        run: |
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme VulnLabApp \
            -configuration Debug \
            -archivePath $PWD/build/VulnLabApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/VulnLabApp.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r VulnLabApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VulnLabApp-Unsigned
          path: VulnLabApp.ipa
