name: Build Unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build App Without Signing
        run: |
          xcodebuild archive \
            -project VulnLabAppiOS.xcodeproj \
            -scheme VulnLabAppiOS \
            -configuration Debug \
            -archivePath $PWD/build/VulnLabAppiOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/VulnLabAppiOS.xcarchive/Products/Applications/VulnLabAppiOS.app Payload/
          zip -r VulnLabAppiOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VulnLabAppiOS-Unsigned
          path: VulnLabAppiOS.ipa
